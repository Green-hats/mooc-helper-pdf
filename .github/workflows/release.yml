name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get Version
        id: version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.PACKAGE_VERSION }}
        with:
          script: |
            const tag = `v${process.env.PACKAGE_VERSION}`;
            let data;
            try {
              // Reuse the release if the tag already exists
              ({ data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              }));
              ({ data } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                name: `mooc-helper v${process.env.PACKAGE_VERSION}`,
                body: 'See the assets to download this version and install.',
                draft: true,
                prerelease: false,
              }));
            } catch {
              ({ data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `mooc-helper v${process.env.PACKAGE_VERSION}`,
                body: 'See the assets to download this version and install.',
                draft: true,
                prerelease: false,
              }));
            }
            core.setOutput('release_id', data.id)

  build-tauri:
    name: Build ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install

      - name: Build & Upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 3

  build-arch:
    name: Build Arch
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            rust \
            clang \
            webkit2gtk-4.1 \
            gtk3 \
            libappindicator-gtk3 \
            librsvg \
            patchelf \
            xdg-utils \
            ca-certificates \
            sudo \
            tar \
            xz \
            perl

      - name: Install Node.js 20
        run: |
          curl -fsSL https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz \
            -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /opt
          ln -sf /opt/node-v20.20.2-linux-x64/bin/* /usr/local/bin/
          mkdir -p /usr/local/lib/node_modules
          npm i -g --prefix /usr/local pnpm@10.4.0
          node --version
          pnpm --version

      - name: Get Version
        id: version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Arch Package
        run: |
          # makepkg refuses to run as root; create a build user
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          chmod -R u+rwx "$GITHUB_WORKSPACE"

          mkdir -p "$GITHUB_WORKSPACE/pkgbuild/src"
          cp packaging/arch/PKGBUILD "$GITHUB_WORKSPACE/pkgbuild/PKGBUILD"
          tar --exclude='./pkgbuild' --exclude='./.git' --exclude='./target' \
            --exclude='./node_modules' --exclude='./out' --exclude='./.next' \
            -cf - . | tar -xf - -C "$GITHUB_WORKSPACE/pkgbuild/src"
          chown -R builder:builder "$GITHUB_WORKSPACE/pkgbuild"

          su builder -c "cd '$GITHUB_WORKSPACE/pkgbuild' && makepkg -f"

      - name: Upload Arch Package
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.PACKAGE_VERSION }}
          files: ${{ github.workspace }}/pkgbuild/mooc-helper-*.pkg.tar.zst

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
